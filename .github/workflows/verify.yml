
name: verify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-main
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -U online-judge-verify-helper
          python -m pip install "setuptools<82"
          python -c "import pkg_resources"

      - name: Configure Linux environment
        run: |
          sed -i 's/, "-Wl,-stack_size,0x10000000"//' .verify-helper/config.toml

      - name: Update main
        run: git pull --ff-only origin main

      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          ulimit -s unlimited
          oj-verify all
