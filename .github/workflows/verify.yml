
name: verify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -U online-judge-verify-helper
          python -m pip install "setuptools<82"

      - name: Configure Linux environment
        run: |
          mkdir -p .verify-helper
          cat > .verify-helper/config.toml <<'EOF'
          [[languages.cpp.environments]]
          CXX = "g++"
          CXXFLAGS = ["-O2", "-std=c++23"]
          EOF

      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          ulimit -s 262144
          oj-verify all
